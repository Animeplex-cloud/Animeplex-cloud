<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">Animeplex-cloud — profile panels</title><desc id="d">Manga page layout. What I build: small anime-themed sites, a weather report app and PHP experiments shipped on GitHub Pages. Languages: php is PHP 69.3% and HTML 30.7%; wheather_report is JavaScript 51.3%, HTML 28.3%, CSS 20.4%. Repositories: animeplex.github.io, AnimeHub.gihub.io, wheather_report, php. Find the code at github.com/Animeplex-cloud.</desc><style>
.burst{opacity:0;transform:scale(.25);animation:burst .7s cubic-bezier(.2,.9,.2,1) forwards}
.slam{opacity:0;animation:slam .55s cubic-bezier(.2,1.4,.4,1) forwards}
.pop{opacity:0;transform:scale(.6);animation:pop .4s cubic-bezier(.2,1.5,.4,1) forwards}
.grow{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;animation:grow .8s ease-out forwards}
@keyframes burst{to{opacity:1;transform:scale(1)}}
@keyframes slam{0%{opacity:0;transform:scale(1.7)}100%{opacity:1;transform:scale(1)}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
